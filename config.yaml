market_type: futures  # spot or futures

exchange:
  binance:
    testnet: false
    proxy: "http://127.0.0.1:7897"  # e.g. http://127.0.0.1:7890
  hyperliquid:
    testnet: false
    vault_address: ""  # optional, for vault trading

trading:
  symbols:
    - BTC/USDT
  timeframes:
    - 1h
  default_leverage: 1

data:
  parquet_dir: data/parquet
  database_url: sqlite+aiosqlite:///data/trading.db

# Strategy-specific params (passed to strategy.params)
strategy_params:
  ma_crossover:
    fast_period: 20
    slow_period: 50
  rsi_reversal:
    period: 14
    oversold: 30
    overbought: 70
  llm_orderbook:
    strategic_tf: 15m
    tactical_tf: 5m
    base_amount: 0.01
    direction_ttl_minutes: 15
    model: deepseek-v4-pro
    max_daily_calls: 200
  funding_rate_arb:
    notional: 1000
    min_funding_rate: 0.0001
    exit_funding_rate: 0
    check_interval: 300
  market_maker:
    quote_size: 0.001
    base_spread_bps: 5.0
    max_spread_bps: 50.0
    cycle_interval: 2.0
    max_positions: 5

screener:
  enabled: true
  min_volume_usdt: 10_000_000  # Min 24h volume in USDT
  quote_currency: USDT
  max_symbols: 20              # Max symbols to trade

risk:
  max_drawdown_pct: 0.2       # 20% max drawdown before halt
  max_position_pct: 0.1       # Max 10% of equity per position
  max_open_positions: 5
  min_confidence: 0.5
  max_leverage: 3
